# Case mode: an ephemeral agent run investigating exactly one candidate.
# Delivers via pull request; ci.yml (tests + verify.py) is the publication
# gate, automerge.yml completes the standing delegation once CI is green.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription, preferred — no per-token
# billing) or ANTHROPIC_API_KEY (API billing, fallback). Degrades honestly:
# without either secret the run fails visibly.
name: case-mode

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Candidate id (c-YYYYMMDD-NN)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: case-${{ inputs.candidate_id }}

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require model access
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN (subscription) nor ANTHROPIC_API_KEY (API billing) is configured — case mode cannot run. The candidate stays OPEN; nothing is invented."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        run: |
          python -m pip install --quiet -e ./sentinel
          npm install -g @anthropic-ai/claude-code

      - name: Investigate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE: ${{ inputs.candidate_id }}
        run: |
          git checkout -b "case/$CANDIDATE"
          {
            cat case_mode/PROMPT.md
            echo
            echo "Candidate to investigate: $CANDIDATE"
          } > "$RUNNER_TEMP/prompt.md"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --permission-mode bypassPermissions \
            --output-format json \
            > "$RUNNER_TEMP/result.json" || true
          jq -r '.result // empty' "$RUNNER_TEMP/result.json" | tail -c 2000 || true

      - name: Record run in the autonomy protocol
        env:
          CANDIDATE: ${{ inputs.candidate_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sentinel import autonomy

          candidate = os.environ["CANDIDATE"]
          result_path = Path(os.environ["RUNNER_TEMP"]) / "result.json"
          model, cost, tokens = None, 0.0, 0
          try:
              result = json.loads(result_path.read_text())
              model = ",".join(result.get("modelUsage", {}).keys()) or None
              cost = float(result.get("total_cost_usd") or 0.0)
              usage = result.get("usage") or {}
              tokens = int(usage.get("input_tokens", 0)) + int(usage.get("output_tokens", 0))
          except Exception as err:  # the run record must exist even on a broken result
              autonomy.append_line(Path("cases") / candidate / "log.jsonl",
                                   "case-run-result-unreadable", "machine",
                                   detail={"error": err.__class__.__name__})
          autonomy.append_line(Path("cases") / candidate / "log.jsonl",
                               "case-mode-run", "machine", model=model,
                               tokens=tokens, cost=cost, currency="USD",
                               detail={"workflow": "case-mode.yml"})
          PY

      - name: Deliver as pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_id }}
        run: |
          git config user.name "Observatory"
          git config user.email "observatory@state-before-interface.invalid"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::case mode produced no changes for $CANDIDATE"
            exit 1
          fi
          git commit -m "case $CANDIDATE: investigation run"
          git push -u origin "case/$CANDIDATE"
          gh pr create \
            --title "case $CANDIDATE" \
            --body "Autonomous case-mode delivery for candidate $CANDIDATE. Gate: ci (tests + verify.py). Cost and model are recorded in cases/$CANDIDATE/log.jsonl."
