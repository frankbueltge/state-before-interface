# Publishes the committed public/ directory to GitHub Pages.
# Decision 2026-08-08: GitHub Pages instead of Cloudflare Pages — zero secrets,
# zero manual setup, live from day one. The lesson from frankbueltge.de is
# kept either way: exactly ONE deployer for this project.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
