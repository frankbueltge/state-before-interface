# Publishes the committed public/ directory to Cloudflare Pages.
# Lesson from frankbueltge.de kept: exactly ONE deployer for the project.
# Degrades honestly: without the CF secret the page lives only in the repo.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy public/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CF secret not configured — deploy skipped; the page exists in the repo."
            exit 0
          fi
          npx wrangler@4 pages deploy public \
            --project-name=state-before-interface --branch=main
